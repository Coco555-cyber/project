<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .role-select { display:inline; font-weight:normal; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Sign Up for AttendanceChimp</h2>
        <form action="/app/createUser" method="POST">
            <div class="form-group">
                <label for="user_name">Username:</label>
                <input type="text" id="user_name" name="user_name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label>Role:</label>
                <input type="radio" id="student" name="is_student" value="1" checked>
                <label for="student" class="role-select">Student</label>
                <br>
                <input type="radio" id="instructor" name="is_student" value="0">
                <label for="instructor" class="role-select">Instructor</label>
            </div>
            
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
