<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="time"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .checkbox-group label { display: inline; font-weight: normal; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Course</h2>
        <form action="/app/createCourse" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="course-name">Course Name:</label>
                <input type="text" id="course-name" name="course-name" required>
            </div>
            <div class="form-group">
                <label for="start-time">Start Time:</label>
                <input type="time" id="start-time" name="start-time" required>
            </div>
            <div class="form-group">
                <label for="end-time">End Time:</label>
                <input type="time" id="end-time" name="end-time" required>
            </div>
            <div class="form-group checkbox-group">
                <label>Days:</label><br>
                <input type="checkbox" id="day-mon" name="day-mon" value="1"> <label for="day-mon">Mon</label><br>
                <input type="checkbox" id="day-tue" name="day-tue" value="1"> <label for="day-tue">Tue</label><br>
                <input type="checkbox" id="day-wed" name="day-wed" value="1"> <label for="day-wed">Wed</label><br>
                <input type="checkbox" id="day-thu" name="day-thu" value="1"> <label for="day-thu">Thu</label><br>
                <input type="checkbox" id="day-fri" name="day-fri" value="1"> <label for="day-fri">Fri</label>
            </div>
            <button type="submit">Create Course</button>
        </form>
    </div>
</body>
</html>
