<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Lecture</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Lecture</h2>
        <form action="/app/createLecture" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="choice">Course Name:</label>
                <input type="text" id="choice" name="choice" required placeholder="Course name">
            </div>
            <button type="submit">Create Lecture</button>
        </form>
    </div>
</body>
</html>
