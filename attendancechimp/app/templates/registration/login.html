<!DOCTYPE html>
<html><head>
    <title>Login</title>
    <style>
        input {
            padding: 6px;
            width: 200px;
        }
    </style>
</head>

<body style="text-align:center; font-family:Arial;">
    <h1>Log In</h1>
    
    <form method="POST" style="display: inline-block; text-align: left; margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="username_id">Username:</label><br>
            <input type="text" id="id_username" name="username" required>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="password_id">Password:</label><br>
            <input type="password" id="password_id" name="password" required>
        </div>
        
        <button type="submit">Log In</button>
    </form>
</body>
</html>
